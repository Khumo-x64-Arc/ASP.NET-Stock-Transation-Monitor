# One-command demo:  docker compose up --build   ->  http://localhost:5080
name: stockmonitor
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  db-init:            # applies database/*.sql in order (idempotent)
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on: { sql: { condition: service_healthy } }
    environment: { SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}" }
    volumes: ["./database:/scripts:ro"]
    entrypoint: ["/bin/bash", "-c", "for f in /scripts/*.sql; do echo \"== $$f\"; /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P \"$$SA_PASSWORD\" -C -b -i \"$$f\" || exit 1; done"]
    restart: "no"

  etl:                # batch load; rows on/after the cutoff are queued for live replay
    build: { context: ., dockerfile: src/StockMonitor.Etl/Dockerfile }
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      STOCKMONITOR_ConnectionStrings__StockMonitor: "Server=sql,1433;Database=StockMonitor;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=True"
    volumes: ["./data:/data:ro"]
    command: ["--file", "/data/Open Stock Transaction Data 2020-2024.xlsx", "--cutoff", "2024-01-01"]
    restart: "no"

  web:
    build: { context: ., dockerfile: src/StockMonitor.Web/Dockerfile }
    depends_on: { etl: { condition: service_completed_successfully } }
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      STOCKMONITOR_ConnectionStrings__StockMonitor: "Server=sql,1433;Database=StockMonitor;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=True"
    ports: ["5080:8080"]

volumes:
  sqldata:
